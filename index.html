<!doctype html>
<!--
  Root HTML document.
  Two things worth knowing if you edit this file:
  1. `data-palette` and `data-text-scale` are set on <html> at runtime by the
     settings reducer. Every colour and font-size token in tokens.css keys off
     those attributes, so theming never touches component code.
  2. The Google Fonts <link> is a progressive enhancement - the CSS font stacks
     fall back to system fonts, so the app still looks right offline.
-->
<html lang="en" data-palette="default" data-text-scale="100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2B2622" />
    <meta name="description" content="PackPal - accessible per-event packing checklists." />

    <!-- iOS needs these to install as a standalone app from Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <title>PackPal</title>
  </head>
  <body>
    <!-- Skip link: first tab stop for keyboard users, jumps past the nav. -->
    <a class="skip-link" href="#main">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
